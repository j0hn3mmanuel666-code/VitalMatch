<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline | VitalMatch</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #f8fafc; color: #111827; display: flex; min-height: 100vh; align-items: center; justify-content: center; padding: 24px; }
    .card { max-width: 480px; width: 100%; background: #ffffff; border-radius: 24px; box-shadow: 0 18px 40px rgba(15, 23, 42, 0.12); padding: 32px; text-align: center; }
    .icon { width: 72px; height: 72px; margin: 0 auto 24px; background: #ef4444; border-radius: 50%; display: grid; place-items: center; color: white; }
    .icon svg { width: 36px; height: 36px; }
    h1 { margin-bottom: 16px; font-size: 2rem; }
    p { margin-bottom: 24px; line-height: 1.6; color: #4b5563; }
    a { display: inline-block; color: #ffffff; background: #0ea5a4; padding: 12px 24px; border-radius: 9999px; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2z"></path>
        <path d="M12 8v4"></path>
        <path d="M12 16h.01"></path>
      </svg>
    </div>
    <h1>Offline Mode</h1>
    <p>VitalMatch is currently offline. You can keep using the app once your connection is restored, or go back to the homepage for cached content.</p>
    <a href="/">Go back home</a>
  </div>
</body>
</html>
